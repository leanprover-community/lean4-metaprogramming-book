name: Update Lean

on:
  schedule:
    # 毎日実行
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update_lean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Update Lean project
        uses: leanprover-community/lean-update@0105e583342f48f2555b2cdbb02792709f217eb3 # main
        with:
          update_if_modified: lean-toolchain
          build_args: "--log-level=warning --fail-level=warning"